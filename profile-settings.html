<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки профиля — КиноПоток</title>
<link rel="stylesheet" href="css/style.css">
<script>
  (function(){
    if (!localStorage.getItem('kinopotok_session')) location.replace('login.html');
  })();
</script>
<style>
  .settings-wrap { max-width: 800px; margin: 40px auto; padding: 0 20px; }
  .settings-box { background: rgba(18,18,28,0.7); border: 1px solid var(--border); border-radius: 20px; padding: 30px; }
  .settings-box h2 { font-size: 22px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
  .form-group input { width: 100%; padding: 12px; background: #0a0a12; border: 1px solid var(--border); border-radius: 10px; color: #fff; outline: none; }
  .form-group input:focus { border-color: var(--accent); }
  .btn-save { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-save:hover { opacity: 0.9; }
  .top-select { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .top-num { font-size: 18px; font-weight: 800; color: var(--accent); width: 24px; }
  .top-select select { flex: 1; padding: 10px; background: #0a0a12; border: 1px solid var(--border); border-radius: 8px; color: #fff; }
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">КиноПоток</a>
  <nav class="nav">
    <a href="index.html" class="nav-link">Главная</a>
    <a href="movies.html" class="nav-link">Фильмы</a>
    <a href="series.html" class="nav-link">Сериалы</a>
    <a href="collections.html" class="nav-link">Подборки</a>
  </nav>
  <a href="profile.html" class="btn btn-ghost" style="margin-left:auto;">В профиль</a>
</header>

<div class="settings-wrap">
  <h1 class="page-title" style="margin-top:0;">⚙️ Настройки профиля</h1>
  <div class="settings-box">
    <h2>Личные данные</h2>
    <div class="form-group">
      <label>Ваш Никнейм</label>
      <input type="text" id="setName" placeholder="Введите имя...">
    </div>
    <div class="form-group">
      <label>Ссылка на Аватарку (URL)</label>
      <input type="url" id="setAvatar" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Ссылка на Фон профиля (URL)</label>
      <input type="url" id="setBgImage" placeholder="https://...">
    </div>

    <h2 style="margin-top:30px;">Ваш Топ-5 фильмов</h2>
    <div id="topList"></div>

    <button id="btnSaveProfile" class="btn-save">💾 Сохранить всё</button>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.currentUser();
  if (!user) return;

  document.getElementById('setName').value = user.name || '';
  document.getElementById('setAvatar').value = user.avatar || '';
  document.getElementById('setBgImage').value = user.bgImage || '';

  const topList = document.getElementById('topList');
  let currentTop = user.top5 || [];

  for (let i = 0; i < 5; i++) {
    const div = document.createElement('div');
    div.className = 'top-select';
    div.innerHTML = `
      <div class="top-num">#${i + 1}</div>
      <select id="topSelect${i}">
        <option value="">-- Не выбрано --</option>
        ${ALL_CONTENT.map(m => `<option value="${m.id}">${m.title} (${m.year})</option>`).join('')}
      </select>
    `;
    topList.appendChild(div);
    if (currentTop[i]) document.getElementById(`topSelect${i}`).value = currentTop[i];
  }

  document.getElementById('btnSaveProfile').addEventListener('click', () => {
    const newTop = [];
    for (let i = 0; i < 5; i++) {
      const val = document.getElementById(`topSelect${i}`).value;
      if (val) newTop.push(val);
    }

    Auth.saveCurrentUser({
      name: document.getElementById('setName').value.trim(),
      avatar: document.getElementById('setAvatar').value.trim(),
      bgImage: document.getElementById('setBgImage').value.trim(),
      top5: newTop
    });

    alert('Сохранено!');
    window.location.href = 'profile.html';
  });
});
</script>
</body>
</html>
