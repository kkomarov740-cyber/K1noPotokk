  <input class="search" type="text" placeholder="Поиск сериалов...">

      <div class="stats">

        <div class="stat"><b id="statMovies">0</b><span>фильмов</span></div>

        <button class="tab-btn active" data-tab="achievements">🏆</button>
        <button class="tab-btn" data-tab="quests">🎯</button>

      <div class="tab-content" id="tabContent"></div>

      <a href="profile.html" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px;text-decoration:none;">👤 Мой профиль</a>
      <a href="profile-settings.html" class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:8px;text-decoration:none;">⚙️ Настройки</a>
      <button id="logoutBtn" class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:8px">🚪 Выйти</button>
    </div>
  </div>
</header>

<section class="container">
  <h1 class="page-title">📺 Сериалы</h1>
  <div class="filter-bar">
    <button class="filter-chip active" data-filter="all">Все</button>
    <button class="filter-chip" data-filter="Драма">Драма</button>
    <button class="filter-chip" data-filter="Фэнтези">Фэнтези</button>
    <button class="filter-chip" data-filter="Криминал">Криминал</button>
    <button class="filter-chip" data-filter="Фантастика">Фантастика</button>
    <button class="filter-chip" data-filter="Комедия">Комедия</button>
    <button class="filter-chip" data-filter="Триллер">Триллер</button>
    <button class="filter-chip" data-filter="Детектив">Детектив</button>
    <button class="filter-chip" data-filter="Ужасы">Ужасы</button>
    <button class="filter-chip" data-filter="Мультфильм">Мультфильмы</button>
  </div>
  <div class="grid" id="seriesGrid"></div>
</section>

<footer class="footer">
  <div style="max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; align-items: center;">

    <div style="font-size: 13px; color: #9a9aad;">
      Служба поддержки:
      <a href="mailto:kinopotok854@gmail.com" style="font-weight: 600;">kinopotok854@gmail.com</a>
    </div>
  </div>
</footer>

<!-- Кнопка "Наверх" -->
<button class="scroll-to-top" id="scrollToTop" title="Вернуться наверх">
  <svg viewBox="0 0 24 24" width="24" height="24">
    <path d="M12 4l-8 8h6v8h4v-8h6z" fill="currentColor"/>
  </svg>
</button>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/gamification.js"></script>
<script src="js/profile.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/grid.js"></script>
<script src="js/search.js"></script>
<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('burgerMenu')?.addEventListener('click', () => {
    document.getElementById('mainNav').classList.toggle('open');
  });

  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const genre = params.get('genre');
    let items = SERIES.slice();
    if (genre) items = items.filter(m => m.genre === genre);
    renderGrid('seriesGrid', items);

    if (genre) {
      document.querySelectorAll('.filter-chip').forEach(c => {
        c.classList.toggle('active', c.dataset.filter === genre);
      });
    }

    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const f = chip.dataset.filter;
        const list = f === 'all' ? SERIES : SERIES.filter(m => m.genre === f);
        renderGrid('seriesGrid', list);
      });
    });
  });
</script>
</body>
</html>
