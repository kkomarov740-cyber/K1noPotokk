<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — КиноПоток</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .auth-card { width:100%; max-width:420px; background:rgba(18,18,28,.98); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:36px 32px; box-shadow:0 30px 80px rgba(245,158,11,.25); }
  .auth-logo { text-align:center; margin-bottom:8px; }
  .auth-logo img { height: 50px; margin: 0 auto; display: block; }
  .auth-sub { text-align:center; color:#9a9aad; font-size:13px; margin-bottom:26px; }
  .auth-tabs { display:flex; gap:6px; margin-bottom:22px; background:rgba(255,255,255,.04); padding:6px; border-radius:12px; }
  .auth-tab { flex:1; padding:10px; font-size:14px; font-weight:600; background:transparent; border:none; color:#9a9aad; border-radius:8px; cursor:pointer; transition:all .2s; }
  .auth-tab.active { color:#fff; background:linear-gradient(135deg,#f59e0b,#ea580c); }
  .auth-field { margin-bottom:14px; }
  .auth-field label { display:block; font-size:12px; color:#9a9aad; margin-bottom:6px; font-weight:600; }
  .auth-field input { width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:12px 14px; color:#fff; font-size:14px; outline:none; transition:all .2s; }
  .auth-field input:focus { border-color:#f59e0b; background:rgba(245,158,11,.08); }
  .auth-error { color:#f87171; font-size:12px; margin-bottom:12px; min-height:16px; }
  .auth-submit { width:100%; padding:13px; font-size:15px; font-weight:700; background:linear-gradient(135deg,#f59e0b,#ea580c); border:none; border-radius:12px; color:#fff; cursor:pointer; transition:all .2s; margin-top:6px; }
  .auth-submit:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(245,158,11,.5); }
  .auth-note { text-align:center; font-size:12px; color:#6b6b7b; margin-top:18px; }
  .auth-form { display:none; }
  .auth-form.active { display:block; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="images/logo.png" alt="КиноПоток">
    </div>
    <div class="auth-sub">Войдите, чтобы начать смотреть</div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-form="login">Вход</button>
      <button class="auth-tab" data-form="register">Регистрация</button>
    </div>

    <form class="auth-form active" id="formLogin">
      <div class="auth-field"><label>Логин</label><input type="text" id="loginName" required></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="loginPass" required></div>
      <div class="auth-error" id="loginError"></div>
      <button type="submit" class="auth-submit">Войти</button>
    </form>

    <form class="auth-form" id="formRegister">
      <div class="auth-field"><label>Логин</label><input type="text" id="regName" required></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="regPass" required></div>
      <div class="auth-field"><label>Повторите пароль</label><input type="password" id="regPass2" required></div>
      <div class="auth-error" id="regError"></div>
      <button type="submit" class="auth-submit">Зарегистрироваться</button>
    </form>

    <div class="auth-note">Данные хранятся в этом браузере</div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      tab.classList.add('active');
      const id = tab.dataset.form === 'login' ? 'formLogin' : 'formRegister';
      document.getElementById(id).classList.add('active');
    });
  });

  document.getElementById('formLogin').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('loginName').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err  = document.getElementById('loginError');
    err.textContent = '';
    const r = Auth.login(name, pass);
    if (!r.ok) { err.textContent = r.error; return; }
    window.location.href = 'index.html';
  });

  document.getElementById('formRegister').addEventListener('submit', e => {
    e.preventDefault();
    const name  = document.getElementById('regName').value.trim();
    const pass  = document.getElementById('regPass').value;
    const pass2 = document.getElementById('regPass2').value;
    const err   = document.getElementById('regError');
    err.textContent = '';
    if (pass !== pass2) { err.textContent = 'Пароли не совпадают'; return; }
    const r = Auth.register(name, pass);
    if (!r.ok) { err.textContent = r.error; return; }
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
